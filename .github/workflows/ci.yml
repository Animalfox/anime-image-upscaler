name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Required community files
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f README.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f CHANGELOG.md
          test -f pyproject.toml
          test -f requirements.txt
          test -f Makefile
          test -s weights/RealESRGAN_x4plus_anime_6B.pth

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.14.0

      - name: Lint
        run: ruff check app

      - name: Syntax check
        run: python -m compileall -q app
